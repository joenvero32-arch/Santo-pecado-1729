<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Santo Pecado 17-29</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f7f3eb;
  --dark:#111;
  --gold:#d6a84f;
  --card:#fff;
  --muted:#777;
  --danger:#b21f2d;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#171717;
  padding-bottom:90px;
}

header{
  background:#111;
  color:#fff;
  padding:16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 15px #0004;
}

.head{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  border:2px solid #fff;
}

.brand strong{
  display:block;
  font-size:20px;
  letter-spacing:.5px;
}

.brand small{
  color:#ddd;
}

.gear{
  border:1px solid #555;
  background:#222;
  color:#fff;
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:22px;
}

.hero{
  background:
    radial-gradient(circle at center,#5b461f 0,#211b12 45%,#0e0e0e 100%);
  color:#fff;
  padding:32px 18px;
  text-align:center;
}

.hero h1{
  margin:0 0 8px;
  font-size:32px;
}

.hero p{
  margin:5px 0;
  color:#ddd;
}

.notice{
  max-width:1000px;
  margin:14px auto;
  padding:13px 16px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 2px 10px #0001;
  text-align:center;
  font-weight:bold;
}

main{
  max-width:1000px;
  margin:auto;
  padding:0 14px;
}

.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0 14px;
  scrollbar-width:none;
}

.nav button{
  white-space:nowrap;
  border:1px solid #ccc;
  background:#fff;
  border-radius:25px;
  padding:11px 16px;
  font-weight:bold;
}

.nav button.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.categoryTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:5px 0 15px;
}

.categoryTitle h2{
  margin:0;
  font-size:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.product{
  background:#fff;
  border-radius:17px;
  padding:14px;
  box-shadow:0 3px 12px #0001;
  border:1px solid #eee;
}

.productEmoji{
  height:95px;
  border-radius:13px;
  background:linear-gradient(135deg,#222,#54401e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  margin-bottom:10px;
}

.product h3{
  margin:5px 0;
  font-size:17px;
}

.product p{
  color:#777;
  font-size:13px;
  min-height:34px;
  margin:6px 0;
}

.price{
  font-size:18px;
  font-weight:900;
  margin:9px 0;
}

.add{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:11px;
  border-radius:11px;
  font-weight:bold;
}

.cartBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  color:#fff;
  padding:12px;
  z-index:30;
  box-shadow:0 -3px 15px #0004;
}

.cartBar button{
  width:100%;
  max-width:1000px;
  display:block;
  margin:auto;
  background:var(--gold);
  color:#111;
  border:0;
  border-radius:13px;
  padding:15px;
  font-size:17px;
  font-weight:900;
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:50;
  display:none;
  overflow:auto;
  padding:20px 12px;
}

.modal.open{
  display:block;
}

.modalCard{
  background:#fff;
  max-width:650px;
  margin:30px auto;
  border-radius:20px;
  padding:20px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.close{
  border:0;
  background:#eee;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

.cartItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-weight:bold;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  padding:15px 0;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,select,textarea{
  width:100%;
  border:1px solid #ccc;
  border-radius:11px;
  padding:13px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.whatsapp{
  width:100%;
  border:0;
  background:#168c45;
  color:#fff;
  padding:15px;
  border-radius:12px
}
</style>
</head>
<body>
  <header>SANTO PECADO 17-29</header>
  <main>
    <h1>PECA POR EL SABOR</h1>
    <p>Haz tu pedido fácil, rápido y delicioso.</p>
  </main>
</body>
</html>
